openapi: 3.1.0

info:
  title: Hash
  description: REST API for Task Management
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: Authentication
    description: Authentication and authorization operations

  - name: Users
    description: User management operations

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Authenticate a user and return a JWT access token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Invalid credentials

        '404':
          description: User not found

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout authenticated user
      description: Invalidates the current authenticated session.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Logout successful

        '401':
          description: Unauthorized

  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user account.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'

      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          description: Invalid request

        '409':
          description: Email already registered

  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves a user by its identifier.

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '404':
          description: User not found

    put:
      tags:
        - Users
      summary: Update user
      description: Updates an existing user.

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'

      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete user
      description: Removes a user. Soft delete is recommended.

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '204':
          description: User deleted successfully

        '404':
          description: User not found

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    UserCreate:
      type: object

      required:
        - name
        - email
        - password

      properties:

        name:
          type: string
          example: John Doe

        email:
          type: string
          format: email
          example: john@email.com

        password:
          type: string
          format: password
          example: StrongPassword123

    UserUpdate:
      type: object

      properties:

        name:
          type: string
          example: John Updated

        email:
          type: string
          format: email
          example: updated@email.com

        password:
          type: string
          format: password
          example: NewPassword123

    UserResponse:
      type: object

      properties:

        id:
          type: integer
          example: 1

        name:
          type: string
          example: John Doe

        email:
          type: string
          format: email
          example: john@email.com

    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: john@email.com

        password:
          type: string
          format: password
          example: StrongPassword123

    LoginResponse:
      type: object

      properties:

        access_token:
          type: string
          example: sci19091

        token_type:
          type: string
          example: Bearer